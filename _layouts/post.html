---
layout: default
---
<style>article.entry .hero-img .photo.real{aspect-ratio:auto}article.entry .hero-img .photo.real img{position:static;height:auto}</style>
<article class="entry">
  <header>
    <time class="sp" style="color:var(--mute)" datetime="{{ page.date | date_to_xmlschema }}">{% include datum.html date=page.date %}</time>
    <h1>{{ page.title }}</h1>
  </header>
  <figure class="hero-img">{% include photo.html post=page %}</figure>
  <div class="prose">{{ content }}</div>
  <a class="back sp" href="{{ '/blogg/' | relative_url }}">← alla inlägg</a>
</article>
